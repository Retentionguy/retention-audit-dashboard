<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Lifecycle Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #F2F4F7; --card: #FFFFFF; --ink: #0E1726; --muted: #4A5568; --line: #D5DAE1; --soft: #EEF1F5;
    --s1: #1D4ED8; --s1t: #E8EEFC; --s2: #B45309; --s2t: #FBF0E2; --s3: #0F766E; --s3t: #E3F2EF;
    --bad: #B91C1C; --badt: #FDECEC; --gray: #64748B; --warn: #FCD34D;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r: 12px;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--s1); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar */
  .top { background: var(--ink); color: #fff; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
  .brand b { font-size: 18px; letter-spacing: -0.01em; }
  .brand span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: #A9B6CC; text-transform: uppercase; }
  .clock { display: flex; flex-direction: column; gap: 4px; }
  .clock .time { font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1; }
  .clock .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.on { background: #DCFCE7; color: #14532D; }
  .pill.off { background: #334155; color: #E2E8F0; }
  .pill.warn { background: var(--warn); color: #422006; }
  .seg { display: flex; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: #CBD5E1; padding: 8px 10px; min-height: 36px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .seg button + button { border-left: 1px solid #334155; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }
  .top .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
  .btn:hover { border-color: #9AA5B4; }
  .btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; }
  .btn.primary:hover { background: #1E40AF; }
  .btn.dark { background: #1E293B; border-color: #334155; color: #fff; }
  .btn.good { background: var(--s3); border-color: var(--s3); color: #fff; }
  .btn.bad { background: var(--card); border-color: var(--bad); color: var(--bad); }
  .btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Dialer */
  .dialer { background: #FFF7E6; border-bottom: 1px solid #F3D9A4; padding: 10px 24px; display: flex; flex-direction: column; gap: 8px; }
  .dialer:empty { display: none; }
  .ring { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .ring .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--s2); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .ring b { font-size: 15px; }
  [data-ring] { display: inline-block; min-width: 3ch; text-align: right; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; min-height: 44px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .count { font-family: var(--mono); font-size: 11px; background: var(--soft); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .count.hot { background: var(--bad); color: #fff; }

  main { padding: 20px 24px 60px; max-width: 1680px; margin: 0 auto; }
  section[hidden] { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .kpi span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .kpi b { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi small { color: var(--muted); font-size: 12px; }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
  .col { background: var(--soft); border-radius: var(--r); display: flex; flex-direction: column; min-height: 200px; }
  .col h2 { margin: 0; font-size: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-top: 4px solid var(--c); border-radius: var(--r) var(--r) 0 0; background: var(--card); border-bottom: 1px solid var(--line); }
  .col .list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col .empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }
  .lead { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .lead:hover { border-color: #9AA5B4; }
  .lead .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .lead b { font-size: 14px; }
  .lead .topic { font-size: 13px; color: var(--muted); }
  .lead .next { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--soft); border-radius: 6px; padding: 4px 8px; }
  .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .tag.blue { background: var(--s1t); color: var(--s1); }
  .tag.amber { background: var(--s2t); color: #8A3F07; }
  .tag.teal { background: var(--s3t); color: var(--s3); }
  .tag.red { background: var(--badt); color: var(--bad); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 17px; }
  .panel h3 { margin: 18px 0 8px; font-size: 14px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  td.body { max-width: 520px; white-space: pre-wrap; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

  .task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .task input { width: 20px; height: 20px; margin-top: 2px; }
  .task .t { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .task.done .t b { text-decoration: line-through; color: var(--muted); }

  /* Drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--card); z-index: 21; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.15); border-left: 1px solid var(--line); }
  .drawer header { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .drawer header h2 { margin: 0; font-size: 20px; }
  .drawer .body { overflow-y: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
  .drawer h3 { margin: 0 0 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .facts { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; word-break: break-word; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; background: var(--card); }
  .field textarea { min-height: 70px; resize: vertical; }
  .sched { display: flex; flex-direction: column; gap: 6px; }
  .sched div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; font-size: 13px; padding: 6px 10px; background: var(--soft); border-radius: 6px; }
  .tl { display: flex; flex-direction: column; gap: 8px; }
  .ev { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; font-size: 13px; }
  .ev.out { border-color: var(--s1); }
  .ev.in { border-color: var(--s3); }
  .ev.call { border-color: var(--s2); }
  .ev.alert { border-color: var(--bad); }
  .ev .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ev .h time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ev p { margin: 4px 0 0; white-space: pre-wrap; color: #2D3748; }
  .scores { display: flex; gap: 6px; }
  .scores button { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-family: var(--mono); font-weight: 600; cursor: pointer; }
  .scores button:hover { border-color: var(--s3); color: var(--s3); }

  /* Modal */
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(14, 23, 38, .45); }
  dialog form { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  dialog h2 { margin: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .top { padding: 12px 16px; } main { padding: 16px; } .tabs { padding: 0 8px; } }

  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .days label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .tpl { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .tpl textarea { width: 100%; }
  code, pre { font-family: var(--mono); font-size: 12.5px; }
  pre { background: var(--soft); padding: 12px; border-radius: 8px; overflow-x: auto; }

  .toasts { position: fixed; bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; max-width: min(420px, calc(100% - 32px)); }
  .toast { background: var(--ink); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .toast.alert { background: var(--bad); }
  .toast.good { background: var(--s3); }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span id="bizName">Lead lifecycle engine</span><b>Speed · Persistence · Retention</b></div>
  <div class="clock" aria-live="off">
    <div class="time" id="clockTime">--:--</div>
    <div class="meta"><span id="pillBiz" class="pill off">CLOSED</span><span id="pillSms" class="pill off">SMS QUIET</span><span id="pillMode" class="pill warn">SIM</span><span id="pillTz" class="pill off">TZ</span></div>
  </div>
  <div class="seg" role="group" aria-label="Clock speed" id="speedSeg">
    <button type="button" data-speed="live">Live</button>
    <button type="button" data-speed="60">1 min/s</button>
    <button type="button" data-speed="3600">1 hr/s</button>
    <button type="button" data-speed="86400">1 day/s</button>
    <button type="button" data-speed="0">Pause</button>
  </div>
  <div class="actions">
    <button type="button" class="btn dark" data-act="feed" id="feedBtn" hidden aria-pressed="false">Demo feed</button>
    <button type="button" class="btn dark" data-act="skip">Skip to next action</button>
    <button type="button" class="btn primary" data-act="newLead">+ New lead</button>
  </div>
</div>

<div class="dialer" id="dialer" aria-live="polite"></div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" type="button" data-tab="pipeline" aria-selected="true">Pipeline</button>
  <button role="tab" type="button" data-tab="tasks" aria-selected="false">Tasks <span class="count" id="taskCount">0</span></button>
  <button role="tab" type="button" data-tab="outbox" aria-selected="false">Outbox</button>
  <button role="tab" type="button" data-tab="activity" aria-selected="false">Activity</button>
  <button role="tab" type="button" data-tab="settings" aria-selected="false">Settings</button>
  <button role="tab" type="button" data-tab="guide" aria-selected="false">How it works</button>
</nav>

<main>
  <section id="tab-pipeline">
    <div class="kpis" id="kpis"></div>
    <div class="toolbar"><label for="q" class="sr">Search leads and clients</label><input id="q" type="search" class="btn" style="min-width:260px;justify-content:flex-start;cursor:text" placeholder="Search name, enquiry, product, phone…"><span class="muted" id="qInfo"></span></div>
    <div class="board" id="board"></div>
  </section>
  <section id="tab-tasks" hidden><div class="panel" id="tasksPanel"></div></section>
  <section id="tab-outbox" hidden><div class="panel" id="outboxPanel"></div></section>
  <section id="tab-activity" hidden><div class="panel" id="activityPanel"></div></section>
  <section id="tab-settings" hidden><div id="settingsPanel"></div></section>
  <section id="tab-guide" hidden><div id="guidePanel"></div></section>
</main>

<div id="drawerRoot"></div>

<dialog id="leadDialog" aria-labelledby="leadDlgTitle">
  <form id="leadForm" novalidate onsubmit="return false">
    <h2 id="leadDlgTitle">New lead</h2>
    <p id="lfErr" class="muted" style="margin:0;color:var(--bad)" hidden>Add a name first.</p>
    <p class="muted" style="margin:0">The first touch fires the moment you save — same as a form, lead ad or webhook hitting the system.</p>
    <div class="grid2">
      <div class="field"><label for="lfName">Name *</label><input id="lfName" name="name" required autocomplete="off"></div>
      <div class="field"><label for="lfTopic">Enquiry about</label><input id="lfTopic" name="topic" placeholder="e.g. kitchen renovation"></div>
      <div class="field"><label for="lfPhone">Phone</label><input id="lfPhone" name="phone" type="tel"></div>
      <div class="field"><label for="lfEmail">Email</label><input id="lfEmail" name="email" type="email"></div>
    </div>
    <div class="field"><label for="lfSource">Source</label>
      <select id="lfSource" name="source"><option>Web form</option><option>Meta lead ad</option><option>Google lead ad</option><option>Landing page</option><option>Chatbot</option><option>CRM webhook</option></select>
    </div>
    <div class="acts" style="justify-content: space-between">
      <button type="button" class="btn" data-act="fillSample">Fill sample data</button>
      <div class="acts"><button type="button" class="btn" data-act="closeDialog">Cancel</button><button type="button" class="btn primary" data-act="saveLead">Capture lead</button></div>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ───────────────────────── Constants ───────────────────────── */
const SEC = 1e3, MIN = 60e3, HR = 36e5, DAY = 864e5;
const STORE = 'lead-lifecycle-engine-v1';
const CH = { sms: 'SMS', email: 'Email', whatsapp: 'WhatsApp', call: 'Call', voicemail: 'Voicemail' };
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const STAGES = [
  { id: 'first_touch', label: 'First touch', color: 'var(--s1)' },
  { id: 'persistence', label: 'Persistence cadence', color: 'var(--s2)' },
  { id: 'engaged', label: 'Engaged — with a human', color: 'var(--ink)' },
  { id: 'won', label: 'Clients — retention loop', color: 'var(--s3)' },
  { id: 'nurture', label: 'Long-term nurture', color: 'var(--gray)' },
  { id: 'lost', label: 'Lost / churned', color: '#94A3B8' },
];
const AUTOMATED = ['first_touch', 'persistence', 'nurture'];

const DEFAULT_TPL = {
  ft_sms:      { label: 'Stage 1 · SMS (in hours)', body: 'Hi {first}, got your enquiry about {topic} — calling you in 2 minutes. Prefer to pick a time? {booking}' },
  ft_email:    { label: 'Stage 1 · Email (in hours)', subject: 'Your enquiry about {topic}', body: 'Hi {first},\n\nThanks for getting in touch about {topic}. {rep} from {business} is calling you in the next couple of minutes.\n\nIf now isn\'t good, pick a time that suits you: {booking}\n\n{rep}\n{business}' },
  ft_wa:       { label: 'Stage 1 · WhatsApp (in hours)', body: 'Hi {first}, {rep} from {business} here about your enquiry on {topic}. If it\'s easier, grab a time here: {booking} — or just reply on WhatsApp.' },
  ooh_email:   { label: 'Stage 1 · Email (out of hours)', subject: 'We got your enquiry — {business}', body: 'Hi {first},\n\nThanks for your enquiry about {topic}. We\'re closed right now, so {rep} will call you as soon as we open.\n\nWant to skip the wait? Book a time that suits you: {booking}\n\n{business}' },
  ooh_wa:      { label: 'Stage 1 · WhatsApp auto-reply (out of hours)', body: 'Hi {first}, thanks for your enquiry about {topic}. We\'re closed right now — {rep} will call you when we open. Want to pick your own time? {booking}' },
  ooh_sms:     { label: 'Stage 1 · SMS (out of hours, held in quiet hours)', body: 'Hi {first}, got your enquiry about {topic}. We\'ll call you when we open — or book a time now: {booking}' },
  p_voicemail: { label: 'Stage 2 · Voicemail drop script', body: 'Hi {first}, it\'s {rep} from {business} about your enquiry on {topic}. Sorry I missed you — I\'ll text you a link so you can book a time that suits you.' },
  p_missed:    { label: 'Stage 2 · Missed-call SMS', body: 'Hi {first}, just missed you — book a time here: {booking}' },
  p_d1_wa:     { label: 'Stage 2 · Day 1 WhatsApp', body: 'Hi {first}, {rep} here from {business}. Tried you again about {topic} — what time\'s best for a quick call? Or book here: {booking}' },
  p_d2_email:  { label: 'Stage 2 · Day 2 value email', subject: 'Re: {topic}', body: 'Hi {first},\n\nYou asked about {topic}, so here\'s something useful: [ADD CASE STUDY OR ANSWER TO THEIR QUESTION].\n\nHappy to talk it through — pick a time: {booking}\n\n{rep}' },
  p_d2_sms:    { label: 'Stage 2 · Day 2 SMS', body: 'Hi {first}, I\'ve emailed you something useful on {topic}. Book a quick chat whenever you\'re ready: {booking}' },
  p_d4_wa:     { label: 'Stage 2 · Day 4 WhatsApp', body: 'Hi {first}, still keen to help with {topic}. Is there a better time to reach you?' },
  p_d7_sms:    { label: 'Stage 2 · Day 7 last chance (SMS)', body: 'Hi {first}, should I close your file on {topic}? Reply to keep it open, or book here: {booking}' },
  p_d7_email:  { label: 'Stage 2 · Day 7 last chance (email)', subject: 'Should I close your file?', body: 'Hi {first},\n\nI\'ve tried to reach you a few times about {topic} and don\'t want to keep chasing if the timing\'s wrong.\n\nShould I close your file? If you\'d still like help, just reply or book here: {booking}\n\n{rep}' },
  p_d7_wa:     { label: 'Stage 2 · Day 7 last chance (WhatsApp)', body: 'Hi {first}, last one from me — should I close your file on {topic}? A quick yes/no is perfect.' },
  nurture:     { label: 'Nurture · Monthly email', subject: '{business} — this month', body: 'Hi {first},\n\n[MONTHLY VALUE CONTENT]\n\nWhenever you\'re ready to talk about {topic}: {booking}\n\n{business}' },
  r_checkin:   { label: 'Stage 3 · Check-in + sentiment', subject: 'How\'s it going with {product}?', body: 'Hi {first}, how\'s everything going with {product}? Anything you need?\n\nQuick one: reply 1–5 (5 = great).' },
  r_review:    { label: 'Stage 3 · Review / referral ask (positive)', subject: 'Glad it\'s going well', body: 'Really glad it\'s going well, {first}! Would you mind leaving us a quick review? [REVIEW LINK]\n\nAnd if you know anyone who\'d benefit from {product}, we\'d love an intro.' },
  r_onb1:      { label: 'Stage 3 · Onboarding day 1', subject: 'Welcome to {business}', body: 'Welcome aboard, {first}! Here\'s how to get the most from {product} this week: [ONBOARDING STEPS]. Any questions, just reply.' },
  r_onb7:      { label: 'Stage 3 · Onboarding day 7', subject: 'One week in', body: 'Hi {first}, one week in with {product} — anything we can make easier?' },
  r_onb30:     { label: 'Stage 3 · Onboarding day 30', subject: 'Your first month', body: 'Hi {first}, it\'s been a month with {product}. Here\'s what most clients do next: [NEXT STEP].' },
  r_renewal:   { label: 'Stage 3 · Renewal reminder', subject: 'Your renewal is coming up', body: 'Hi {first}, your {product} renewal is coming up in 30 days. Want to go over anything before then? {booking}' },
};

function browserTz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } }
function defaultSettings() {
  return {
    business: 'Your Business', rep: 'Sam', booking: 'https://your-booking-link.example',
    tz: browserTz(), days: [1, 2, 3, 4, 5, 6], open: '09:00', close: '19:00',
    smsStart: '09:00', smsEnd: '21:00',
    slots: { morning: '10:00', afternoon: '14:30', evening: '18:00' },
    callDelaySec: 45, waDelaySec: 120, ringTimeout: 25,
    interval: 15, taper: true, taperAfter: 90, termMonths: 12, sentimentWaitDays: 3,
    retentionChannel: 'whatsapp', webhook: '', webhookMode: 'simple',
    templates: JSON.parse(JSON.stringify(DEFAULT_TPL)),
  };
}
function fresh() {
  return { v: 1, settings: defaultSettings(), clock: { live: true, simAt: Date.now(), realAt: Date.now(), speed: 1, hold: false }, leads: [], jobs: [], calls: [], tasks: [], messages: [], log: [], seq: 1 };
}

/* ───────────────────────── State ───────────────────────── */
let seeding = false, needsDemo = false;
let S = load();
let dirty = true, saveDue = false, tab = 'pipeline', openId = null, outFilter = 'all';

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const s = JSON.parse(raw);
      const d = defaultSettings();
      s.settings = Object.assign(d, s.settings || {});
      s.settings.templates = Object.assign(JSON.parse(JSON.stringify(DEFAULT_TPL)), s.settings.templates || {});
      s.calls = []; // a ring can't survive a reload
      for (const j of s.jobs) if (j.status === 'ringing') { j.status = 'done'; j.result = 'interrupted'; }
      if (!s.clock.live) { s.clock.realAt = Date.now(); s.clock.hold = false; }
      return s;
    }
  } catch (e) { /* storage unavailable or corrupt: start fresh */ }
  needsDemo = true;
  return fresh();
}
function persist() {
  try {
    const c = S.clock;
    if (!c.live) { c.simAt = now(); c.realAt = Date.now(); }
    localStorage.setItem(STORE, JSON.stringify(S));
  } catch (e) { /* ignore */ }
}
function touch() { dirty = true; saveDue = true; }
const id = (p) => p + (S.seq++).toString(36);

/* ───────────────────────── Clock ───────────────────────── */
function now() {
  const c = S.clock;
  if (c.live) return Date.now();
  const rate = c.hold ? 1 : c.speed;
  return c.simAt + (Date.now() - c.realAt) * rate;
}
function rebase(patch) { const t = now(); S.clock = Object.assign({}, S.clock, { simAt: t, realAt: Date.now() }, patch); }
function setSpeed(v) {
  if (v === 'live') S.clock = { live: true, simAt: Date.now(), realAt: Date.now(), speed: 1, hold: false };
  else rebase({ live: false, speed: Number(v), hold: S.calls.length > 0 });
  touch();
}
function skipToNext() {
  const next = S.jobs.filter(j => j.status === 'pending').sort((a, b) => a.at - b.at)[0];
  if (!next) { toast('Nothing scheduled.'); return; }
  if (S.calls.length) { toast('Resolve the ringing call first.'); return; }
  const wasLive = S.clock.live;
  S.clock = { live: false, simAt: Math.max(now(), next.at), realAt: Date.now(), speed: wasLive ? 1 : S.clock.speed, hold: false };
  touch();
}

/* ───────────────────────── Time-zone maths ───────────────────────── */
const fmtCache = {};
function dtf(tz, opts, key) {
  const k = tz + key;
  if (!fmtCache[k]) fmtCache[k] = new Intl.DateTimeFormat(key === 'parts' ? 'en-US' : 'en-GB', Object.assign({ timeZone: tz }, opts));
  return fmtCache[k];
}
function parts(t) {
  const tz = S.settings.tz;
  const f = dtf(tz, { hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' }, 'parts');
  const o = {};
  for (const p of f.formatToParts(new Date(t))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, wd: DAY_NAMES.indexOf(o.weekday) };
}
function tzOffset(t) { const p = parts(t); return Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(t / 1000) * 1000; }
function zoned(y, m, d, hhmm) { // local wall time in settings.tz → epoch ms
  const [h, mi] = hhmm.split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  let t = guess - tzOffset(guess);
  t = guess - tzOffset(t);
  return t;
}
const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
function inBusiness(t) {
  const p = parts(t), m = p.h * 60 + p.mi, s = S.settings;
  return s.days.includes(p.wd) && m >= toMin(s.open) && m < toMin(s.close);
}
function smsAllowed(t) { const p = parts(t), m = p.h * 60 + p.mi; return m >= toMin(S.settings.smsStart) && m < toMin(S.settings.smsEnd); }
function nextOpening(t) {
  if (inBusiness(t)) return t;
  const p = parts(t);
  for (let i = 0; i < 9; i++) {
    const c = zoned(p.y, p.m, p.d + i, S.settings.open);
    if (c > t && S.settings.days.includes(parts(c).wd)) return c;
  }
  return t + DAY; // no business days configured
}
function nextSmsWindow(t) {
  if (smsAllowed(t)) return t;
  const p = parts(t);
  for (let i = 0; i < 3; i++) { const c = zoned(p.y, p.m, p.d + i, S.settings.smsStart); if (c > t) return c; }
  return t + HR;
}
function slotOf(t) { const p = parts(t), m = p.h * 60 + p.mi; return m < 12 * 60 ? 'morning' : m < 16 * 60 ? 'afternoon' : 'evening'; }
function slotTime(base, dayOffset, slot) {
  const p = parts(base);
  return zoned(p.y, p.m, p.d + dayOffset, S.settings.slots[slot]);
}

/* ───────────────────────── Formatting ───────────────────────── */
function fmtTime(t) {
  const otherYear = parts(t).y !== parts(now()).y;
  return dtf(S.settings.tz, otherYear ? { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' } : { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }, otherYear ? 'fully' : 'full').format(new Date(t));
}
function fmtClock(t) { return dtf(S.settings.tz, { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }, 'clock').format(new Date(t)); }
function fmtDay(t) { return dtf(S.settings.tz, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }, 'day').format(new Date(t)); }
function fmtDur(ms) {
  ms = Math.max(0, ms);
  const s = Math.round(ms / SEC);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function render(str, lead) {
  const s = S.settings;
  const vars = { first: lead.first, name: lead.name, topic: lead.topic || 'your enquiry', product: lead.product || 'your service', booking: s.booking, rep: s.rep, business: s.business, phone: lead.phone || '', email: lead.email || '' };
  return String(str || '').replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}

/* ───────────────────────── Engine: helpers ───────────────────────── */
const leadById = (lid) => S.leads.find(l => l.id === lid);
function addJob(leadId, at, type, o) { const j = Object.assign({ id: id('j'), leadId, at, type, status: 'pending' }, o || {}); S.jobs.push(j); touch(); return j; }
function pendingFor(lid) { return S.jobs.filter(j => j.leadId === lid && (j.status === 'pending' || j.status === 'ringing')).sort((a, b) => a.at - b.at); }
function tl(lead, at, kind, title, text, extra) { lead.tl.push(Object.assign({ at, kind, title, text: text || '' }, extra || {})); touch(); }
function logEv(at, lead, text, kind) {
  S.log.push({ at, leadId: lead ? lead.id : null, name: lead ? lead.name : '', text, kind: kind || 'sys' });
  if (!seeding && S.log.length > 3000) S.log.splice(0, S.log.length - 3000);
  touch();
}
function addTask(lead, title, priority, owner) {
  S.tasks.push({ id: id('t'), leadId: lead.id, name: lead.name, title, priority: priority || 'normal', owner: owner || S.settings.rep, at: now(), done: false });
  touch();
}
function setStage(lead, stage, at) {
  if (lead.stage === stage) return;
  const from = lead.stage;
  lead.stage = stage;
  tl(lead, at, 'sys', 'Stage → ' + (STAGES.find(s => s.id === stage) || {}).label);
  dispatch('lead.stage_changed', lead, { from, to: stage });
}
function halt(lead, reason, at) {
  let n = 0;
  for (const j of S.jobs) if (j.leadId === lead.id && (j.status === 'pending' || j.status === 'ringing')) { j.status = 'cancelled'; j.note = reason; n++; }
  const had = S.calls.length;
  S.calls = S.calls.filter(c => c.leadId !== lead.id);
  if (had && !S.calls.length) releaseHold();
  lead.awaiting = null;
  if (n) {
    tl(lead, at, 'alert', 'Automation halted', reason + ' — ' + n + ' scheduled touch' + (n === 1 ? '' : 'es') + ' cancelled.');
    logEv(at, lead, 'Automation halted (' + reason + '), ' + n + ' cancelled', 'alert');
    dispatch('automation.halted', lead, { reason, cancelled: n });
  }
}
function resolveCh(ch, lead) { return ch === 'pref' ? (lead.pref || S.settings.retentionChannel) : ch; }

/* ───────────────────────── Webhook ───────────────────────── */
function dispatch(event, lead, data, msg) {
  if (seeding) { if (msg) msg.wh = 'demo'; return; }
  const url = (S.settings.webhook || '').trim();
  if (!url) { if (msg) msg.wh = 'not configured'; return; }
  const payload = { event, at: new Date(now()).toISOString(), business: S.settings.business, lead: lead ? { id: lead.id, name: lead.name, phone: lead.phone, email: lead.email, topic: lead.topic, source: lead.source, stage: lead.stage, product: lead.product || null, preferredChannel: lead.pref || null } : null, data: data || {} };
  const json = S.settings.webhookMode === 'json';
  if (msg) msg.wh = 'sending…';
  fetch(url, json
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
    : { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(payload) })
    .then(r => { if (msg) msg.wh = json ? ('HTTP ' + r.status) : 'sent'; touch(); })
    .catch(e => { if (msg) msg.wh = 'failed'; logEv(now(), lead, 'Webhook failed for ' + event + ': ' + e.message, 'alert'); });
}

function send(lead, ch, tplKey, at, why) {
  const t = S.settings.templates[tplKey] || { body: '' };
  const msg = { id: id('m'), at, leadId: lead.id, name: lead.name, ch, tpl: tplKey, label: t.label || tplKey, subject: t.subject ? render(t.subject, lead) : '', body: render(t.body, lead), to: ch === 'email' ? lead.email : lead.phone, wh: '' };
  S.messages.push(msg);
  if (!seeding && S.messages.length > 3000) S.messages.splice(0, S.messages.length - 3000);
  if (!lead.firstTouchAt) lead.firstTouchAt = at;
  tl(lead, at, ch === 'voicemail' ? 'call' : 'out', CH[ch] + (why ? ' · ' + why : ''), (msg.subject ? msg.subject + '\n\n' : '') + msg.body);
  dispatch('message.send', lead, { channel: ch, to: msg.to, template: tplKey, subject: msg.subject, body: msg.body }, msg);
}

/* ───────────────────────── Stage 1: capture + first touch ───────────────────────── */
function createLead(d) {
  const at = now();
  const name = (d.name || '').trim() || 'Unnamed lead';
  const lead = { id: id('L'), name, first: name.split(/\s+/)[0], phone: (d.phone || '').trim(), email: (d.email || '').trim(), topic: (d.topic || '').trim(), source: d.source || 'Web form', createdAt: at, stage: 'first_touch', pref: null, attempts: 0, tl: [], sentiments: [], atRisk: false };
  S.leads.push(lead);
  const s = S.settings;
  tl(lead, at, 'sys', 'Lead captured', 'Source: ' + lead.source);
  dispatch('lead.created', lead);
  if (inBusiness(at)) {
    lead.mode = 'in_hours';
    addJob(lead.id, at, 'msg', { ch: 'sms', tpl: 'ft_sms', why: 'first touch' });
    addJob(lead.id, at, 'msg', { ch: 'email', tpl: 'ft_email', why: 'first touch' });
    addJob(lead.id, at + s.callDelaySec * SEC, 'call', { purpose: 'first' });
    addJob(lead.id, at + s.waDelaySec * SEC, 'msg', { ch: 'whatsapp', tpl: 'ft_wa', why: 'first touch' });
    logEv(at, lead, 'New lead in business hours — SMS + email now, call in ' + s.callDelaySec + 's, WhatsApp in ' + Math.round(s.waDelaySec / 60) + 'm');
  } else {
    lead.mode = 'out_of_hours';
    addJob(lead.id, at, 'msg', { ch: 'email', tpl: 'ooh_email', why: 'out of hours' });
    addJob(lead.id, at, 'msg', { ch: 'whatsapp', tpl: 'ooh_wa', why: 'out-of-hours auto-reply' });
    addJob(lead.id, at, 'msg', { ch: 'sms', tpl: 'ooh_sms', why: 'out of hours' });
    const open = nextOpening(at);
    addJob(lead.id, open, 'call', { purpose: 'first' });
    logEv(at, lead, 'New lead out of hours — email + WhatsApp now, SMS respects quiet hours, call queued for ' + fmtTime(open));
  }
  return lead;
}

/* ───────────────────────── Calls ───────────────────────── */
function startCall(job, lead, at) {
  if (!inBusiness(at)) {
    job.at = nextOpening(at); job.held = (job.held || 0) + 1; job.note = 'outside business hours';
    tl(lead, at, 'sys', 'Call held', 'Outside business hours — moved to ' + fmtTime(job.at));
    touch(); return;
  }
  lead.attempts++;
  if (!lead.firstDialAt) lead.firstDialAt = at;
  job.status = 'ringing';
  S.calls.push({ id: id('c'), leadId: lead.id, jobId: job.id, attempt: lead.attempts, startedReal: Date.now(), startedAt: at });
  if (!seeding && !S.clock.live && !S.clock.hold) { S.clock = { live: false, simAt: at, realAt: Date.now(), speed: S.clock.speed, hold: true }; }
  tl(lead, at, 'call', 'Calling — attempt ' + lead.attempts, lead.phone ? 'Dialling ' + lead.phone : '');
  logEv(at, lead, 'Dialling (attempt ' + lead.attempts + ')', 'call');
  dispatch('call.start', lead, { attempt: lead.attempts, phone: lead.phone });
  toast('Ringing ' + lead.name + ' — answer in the dialer bar');
}
function releaseHold() { if (!S.clock.live && S.clock.hold) rebase({ hold: false }); }
function callOutcome(callId, answered, note) {
  const c = S.calls.find(x => x.id === callId);
  if (!c) return;
  const at = now();
  S.calls = S.calls.filter(x => x.id !== callId);
  if (!S.calls.length) releaseHold();
  const job = S.jobs.find(j => j.id === c.jobId);
  const lead = leadById(c.leadId);
  if (job) { job.status = 'done'; job.result = answered ? 'answered' : 'no answer'; }
  if (!lead) return;
  dispatch('call.result', lead, { attempt: c.attempt, answered });
  if (answered) {
    lead.contactedAt = lead.contactedAt || at;
    tl(lead, at, 'call', 'Call connected', 'Attempt ' + c.attempt);
    logEv(at, lead, 'Call connected on attempt ' + c.attempt, 'good');
    halt(lead, 'Call answered', at);
    setStage(lead, 'engaged', at);
    addTask(lead, 'Qualify ' + lead.name + ' — call connected, log the outcome', 'high');
    toast(lead.name + ' connected — automation stopped, over to you.', 'good');
  } else {
    tl(lead, at, 'call', 'No answer', note || 'Attempt ' + c.attempt);
    logEv(at, lead, 'No answer (attempt ' + c.attempt + ')', 'call');
    if (lead.stage === 'first_touch') startCadence(lead, at);
  }
  touch();
}

/* ───────────────────────── Stage 2: persistence ───────────────────────── */
function startCadence(lead, base) {
  setStage(lead, 'persistence', base);
  lead.cadenceStart = base;
  const first = slotOf(base);
  const rot = ['morning', 'afternoon', 'evening'].filter(s => s !== first);
  const [slotA, slotB] = rot;
  addJob(lead.id, base, 'voicemail', { tpl: 'p_voicemail', why: 'no answer' });
  addJob(lead.id, base, 'msg', { ch: 'sms', tpl: 'p_missed', why: 'missed call' });
  addJob(lead.id, base + 2 * HR, 'call', { purpose: '+2h' });
  const d1 = slotTime(base, 1, slotA);
  addJob(lead.id, d1, 'call', { purpose: 'day 1 · ' + slotA });
  addJob(lead.id, d1, 'msg', { ch: 'whatsapp', tpl: 'p_d1_wa', why: 'day 1' });
  const d2 = slotTime(base, 2, 'morning');
  addJob(lead.id, d2, 'msg', { ch: 'email', tpl: 'p_d2_email', why: 'day 2 value' });
  addJob(lead.id, d2, 'msg', { ch: 'sms', tpl: 'p_d2_sms', why: 'day 2' });
  const d4 = slotTime(base, 4, slotB);
  addJob(lead.id, d4, 'call', { purpose: 'day 4 · ' + slotB });
  addJob(lead.id, d4, 'msg', { ch: 'whatsapp', tpl: 'p_d4_wa', why: 'day 4' });
  const d7 = slotTime(base, 7, 'morning');
  addJob(lead.id, d7, 'msg', { ch: 'sms', tpl: 'p_d7_sms', why: 'day 7 last chance' });
  addJob(lead.id, d7, 'msg', { ch: 'email', tpl: 'p_d7_email', why: 'day 7 last chance' });
  addJob(lead.id, d7, 'msg', { ch: 'whatsapp', tpl: 'p_d7_wa', why: 'day 7 last chance' });
  addJob(lead.id, d7 + DAY, 'to_nurture');
  logEv(base, lead, 'Persistence cadence started (call slots: ' + first + ' → ' + slotA + ' → ' + slotB + ')');
}

/* ───────────────────────── Stage 3: retention ───────────────────────── */
function markWon(lead, product) {
  const at = now();
  halt(lead, 'Deal won', at);
  lead.product = (product || '').trim() || lead.topic || 'your service';
  lead.wonAt = at;
  lead.contactedAt = lead.contactedAt || at;
  lead.checkins = 0;
  setStage(lead, 'won', at);
  const s = S.settings;
  addJob(lead.id, at + DAY, 'msg', { ch: 'pref', tpl: 'r_onb1', why: 'onboarding day 1' });
  addJob(lead.id, at + 7 * DAY, 'msg', { ch: 'pref', tpl: 'r_onb7', why: 'onboarding day 7' });
  addJob(lead.id, at + 30 * DAY, 'msg', { ch: 'pref', tpl: 'r_onb30', why: 'onboarding day 30' });
  addJob(lead.id, at + s.interval * DAY, 'checkin', { n: 1 });
  const renewal = at + Math.round(s.termMonths * 30.44 - 30) * DAY;
  if (renewal > at + DAY) addJob(lead.id, renewal, 'msg', { ch: 'email', tpl: 'r_renewal', why: 'renewal −30 days' });
  logEv(at, lead, 'Deal won (' + lead.product + ') — retention loop started', 'good');
  dispatch('deal.won', lead, { product: lead.product });
  toast(lead.name + ' won — retention loop running.', 'good');
}
function runCheckin(job, lead, at) {
  const s = S.settings;
  lead.checkins = (lead.checkins || 0) + 1;
  send(lead, resolveCh('pref', lead), 'r_checkin', at, 'check-in #' + job.n);
  lead.awaiting = { n: job.n, at };
  addJob(lead.id, at + s.sentimentWaitDays * DAY, 'sentiment_timeout', { n: job.n });
  const age = (at - lead.wonAt) / DAY;
  const step = (s.taper && age >= s.taperAfter - 0.5) ? 30 : s.interval;
  if (age + step <= 730) addJob(lead.id, at + step * DAY, 'checkin', { n: job.n + 1 });
}
function recordSentiment(lead, score) {
  const at = now();
  const n = lead.awaiting ? lead.awaiting.n : null;
  for (const j of S.jobs) if (j.leadId === lead.id && j.type === 'sentiment_timeout' && j.status === 'pending') { j.status = 'cancelled'; j.note = 'answered'; }
  lead.awaiting = null;
  lead.sentiments.push({ at, score, n });
  tl(lead, at, 'in', 'Sentiment: ' + score + '/5', n ? 'Reply to check-in #' + n : '');
  dispatch('sentiment.received', lead, { score, checkin: n });
  if (score >= 4) {
    lead.atRisk = false;
    addJob(lead.id, at + MIN, 'msg', { ch: 'pref', tpl: 'r_review', why: 'happy client → review/referral' });
    logEv(at, lead, 'Positive sentiment (' + score + ') — review/referral ask queued', 'good');
  } else if (score <= 2) {
    escalate(lead, 'scored ' + score + '/5 on check-in' + (n ? ' #' + n : ''), at);
  } else {
    logEv(at, lead, 'Neutral sentiment (3)');
  }
  touch();
}
function escalate(lead, why, at) {
  lead.atRisk = true;
  addTask(lead, 'At-risk client: ' + lead.name + ' ' + why + ' — call them', 'high', 'Account manager');
  tl(lead, at, 'alert', 'Escalated to account manager', why);
  logEv(at, lead, 'ESCALATION — ' + why, 'alert');
  dispatch('client.escalation', lead, { reason: why });
  toast('Alert: ' + lead.name + ' ' + why, 'alert');
}

/* ───────────────────────── Inbound + manual actions ───────────────────────── */
function inbound(lead, ch, text) {
  const at = now();
  if (ch !== 'call') lead.pref = ch;
  lead.contactedAt = lead.contactedAt || at;
  tl(lead, at, 'in', 'Reply via ' + CH[ch], text || '');
  logEv(at, lead, 'Inbound ' + CH[ch] + ' reply', 'good');
  dispatch('message.inbound', lead, { channel: ch, text });
  if (AUTOMATED.includes(lead.stage)) {
    halt(lead, 'Lead replied via ' + CH[ch], at);
    setStage(lead, 'engaged', at);
    addTask(lead, 'Reply to ' + lead.name + ' on ' + CH[ch] + ' now', 'high');
    toast(lead.name + ' replied — all automation stopped, handed to ' + S.settings.rep + '.', 'good');
  } else if (lead.stage === 'won') {
    const m = /^\s*([1-5])\s*$/.exec(text || '');
    if (m && lead.awaiting) { recordSentiment(lead, +m[1]); return; }
    addTask(lead, 'Client message from ' + lead.name + ' on ' + CH[ch], 'normal', 'Account manager');
  }
  touch();
}
function booked(lead) {
  const at = now();
  halt(lead, 'Booked via self-booking link', at);
  lead.booked = true;
  lead.contactedAt = lead.contactedAt || at;
  setStage(lead, 'engaged', at);
  addTask(lead, 'Prep for booked call with ' + lead.name, 'normal');
  dispatch('lead.booked', lead);
  toast(lead.name + ' booked a slot — automation stopped.', 'good');
}
function markLost(lead) { const at = now(); halt(lead, 'Marked lost', at); setStage(lead, 'lost', at); }
function reopen(lead) { const at = now(); setStage(lead, 'engaged', at); addTask(lead, 'Re-engage ' + lead.name, 'normal'); }
function callNow(lead) { addJob(lead.id, now(), 'call', { purpose: 'manual' }); }
function checkinNow(lead) { addJob(lead.id, now(), 'checkin', { n: (lead.checkins || 0) + 1, manual: true }); }

/* ───────────────────────── Job runner ───────────────────────── */
function run(job) {
  const lead = leadById(job.leadId);
  if (!lead) { job.status = 'cancelled'; return; }
  const at = job.at;
  switch (job.type) {
    case 'msg': {
      const ch = resolveCh(job.ch, lead);
      if (ch === 'sms' && !smsAllowed(at)) {
        job.at = nextSmsWindow(at); job.held = (job.held || 0) + 1; job.note = 'SMS quiet hours';
        tl(lead, at, 'sys', 'SMS held', 'Quiet hours — releases ' + fmtTime(job.at));
        return touch();
      }
      send(lead, ch, job.tpl, at, job.why);
      job.status = 'done';
      break;
    }
    case 'voicemail': send(lead, 'voicemail', job.tpl, at, job.why); job.status = 'done'; break;
    case 'call': startCall(job, lead, at); break;
    case 'to_nurture': {
      job.status = 'done';
      setStage(lead, 'nurture', at);
      logEv(at, lead, 'Cadence exhausted with no contact — moved to monthly nurture');
      addJob(lead.id, at + DAY, 'nurture');
      break;
    }
    case 'nurture': send(lead, 'email', 'nurture', at, 'monthly nurture'); job.status = 'done'; addJob(lead.id, at + 30 * DAY, 'nurture'); break;
    case 'checkin': job.status = 'done'; runCheckin(job, lead, at); break;
    case 'sentiment_timeout':
      job.status = 'done';
      if (lead.awaiting && lead.awaiting.n === job.n) { lead.awaiting = null; escalate(lead, 'did not respond to check-in #' + job.n, at); }
      break;
    default: job.status = 'cancelled';
  }
  touch();
}
function jobLabel(j, lead) {
  switch (j.type) {
    case 'msg': return CH[resolveCh(j.ch, lead)] + ' · ' + ((S.settings.templates[j.tpl] || {}).label || j.tpl).replace(/^Stage \d · |^Nurture · /, '');
    case 'voicemail': return 'Voicemail drop';
    case 'call': return 'Call' + (j.purpose && j.purpose !== 'first' ? ' (' + j.purpose + ')' : ' (first attempt)');
    case 'to_nurture': return 'Move to long-term nurture';
    case 'nurture': return 'Email · monthly nurture';
    case 'checkin': return 'Check-in #' + j.n + ' + sentiment ask';
    case 'sentiment_timeout': return 'Escalate if no reply to check-in #' + j.n;
    default: return j.type;
  }
}

/* ───────────────────────── Tick ───────────────────────── */
let lastSave = 0;
function tick() {
  demoFeedTick();
  for (const c of S.calls.slice()) {
    if (Date.now() - c.startedReal > S.settings.ringTimeout * SEC) callOutcome(c.id, false, 'Rang out — no answer');
  }
  for (let n = 0; n < 400; n++) {
    const t = now();
    let due = null;
    for (const j of S.jobs) if (j.status === 'pending' && j.at <= t && (!due || j.at < due.at)) due = j;
    if (!due) break;
    run(due);
  }
  if (S.jobs.length > 4000) S.jobs = S.jobs.filter(j => j.status === 'pending' || j.status === 'ringing' || j.at > now() - 60 * DAY);
  if (dirty) { renderAll(); dirty = false; } else renderLive();
  if (saveDue && Date.now() - lastSave > 1000) { persist(); saveDue = false; lastSave = Date.now(); }
}

function saveSettings(form) {

    interval: Math.max(1, num('interval', s.interval)), taperAfter: num('taperAfter', s.taperAfter), termMonths: Math.max(1, num('termMonths', s.termMonths)), sentimentWaitDays: Math.max(1, num('sentimentWaitDays', s.sentimentWaitDays)),
    retentionChannel: g('retentionChannel') || 'whatsapp', taper: fd.get('taper') === 'on', webhook: g('webhook'), webhookMode: g('webhookMode') || 'simple',

    case 'lost': if (lead) markLost(lead); break;
    case 'reopen': if (lead) reopen(lead); break;
    case 'checkinNow': if (lead) checkinNow(lead); break;
    case 'score': if (lead) recordSentiment(lead, +el.dataset.n); break;
    case 'toggleTask': { const t = S.tasks.find(x => x.id === el.dataset.id); if (t) { t.done = el.checked; touch(); } break; }
    case 'clearDone': S.tasks = S.tasks.filter(t => !t.done); touch(); break;
    case 'testHook': {
      const url = ($('#st_webhook') || {}).value;
      if (!url) { toast('Add a webhook URL first.', 'alert'); break; }
      const prev = S.settings.webhook, prevMode = S.settings.webhookMode;
      S.settings.webhook = url; S.settings.webhookMode = $('#st_wm').value;
      const m = { wh: '' }; dispatch('test', null, { message: 'Test event from the lead lifecycle engine' }, m);
      S.settings.webhook = prev; S.settings.webhookMode = prevMode;
      toast('Test event sent — check your receiver.'); break;
    }
    case 'resetTpl': S.settings.templates = JSON.parse(JSON.stringify(DEFAULT_TPL)); touch(); persist(); renderSettings(); toast('Templates restored.'); break;
    case 'export': {
      persist();
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lead-engine-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); break;
    }
    case 'wipe':
      if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Click again to erase'; setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Erase everything'; }, 4000); break; }
      S = fresh(); openId = null; touch(); persist(); renderSettings(); // fresh() has no demo flag, so the feed stops toast('Everything erased — start capturing real leads.'); break;
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { query = e.target.value; touch(); } });
document.addEventListener('change', (e) => {
  if (e.target.id === 'outF') { outFilter = e.target.value; touch(); }
  if (e.target.id === 'importFile' && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !Array.isArray(s.leads) || !s.settings) throw new Error('not an engine export');
      localStorage.setItem(STORE, txt); S = load(); openId = null; touch(); renderSettings(); toast('Data imported.', 'good');
    }).catch(err => toast('Import failed: ' + err.message, 'alert'));
  }
});
function saveLead() {
  const f = $('#leadForm');
  const d = Object.fromEntries(new FormData(f).entries());
  if (!(d.name || '').trim()) { $('#lfErr').hidden = false; $('#lfName').focus(); return; }
  const lead = createLead(d);
  closeLeadDialog();
  toast(lead.name + ' captured — first touch firing.');
  openId = lead.id;
  touch(); tick();
}
function openLeadDialog() {
  const dlg = $('#leadDialog');
  $('#leadForm').reset(); $('#lfErr').hidden = true;
  if (typeof dlg.showModal === 'function') { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } } else dlg.setAttribute('open', '');
  $('#lfName').focus();
}
function closeLeadDialog() { const dlg = $('#leadDialog'); if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
document.addEventListener('submit', (e) => { e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openId && !$('#leadDialog').open) { openId = null; touch(); }
  if (e.key === 'Enter' && e.target.id === 'rTx') { e.preventDefault(); $('[data-act="reply"]').click(); }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('#leadForm') && e.target.tagName === 'INPUT') { e.preventDefault(); saveLead(); }
});
window.addEventListener('beforeunload', persist);

if (needsDemo) seedDemo();

/* Capture a lead from URL parameters (form redirect / capture link) */
(function captureFromUrl() {
  const q = new URLSearchParams(location.search);
  if (!q.get('name')) return;
  const lead = createLead({ name: q.get('name'), phone: q.get('phone'), email: q.get('email'), topic: q.get('topic'), source: q.get('source') || 'Capture link' });
  toast(lead.name + ' captured from link.');
  history.replaceState(null, '', location.pathname);
})();

setTab('pipeline');
tick();
setInterval(tick, 250);
})();
</script>
